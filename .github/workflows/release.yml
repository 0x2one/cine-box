name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: Verify release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 标签与 package.json 版本必须一致，否则 electron-updater 拿到的版本与产物对不上
      - name: Check tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          echo "tag=v$tag package=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::标签 v$tag 与 package.json 的版本 $version 不一致"
            exit 1
          fi

      # 发版必须带 CHANGELOG 小节，它同时是 Release 说明和客户端更新说明
      - name: Check CHANGELOG entry
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -qF "## 映盒剧场 v${version}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少「## 映盒剧场 v${version}」小节"
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: guard
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows
            os: windows-latest
            target: '--win'
          - platform: macOS Intel
            os: macos-15-intel
            target: '--mac --x64'
          - platform: macOS Apple Silicon
            os: macos-15
            target: '--mac --arm64'
          - platform: Linux
            os: ubuntu-latest
            target: '--linux AppImage deb'
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # 未配置签名证书时跳过 macOS 自动发现，避免构建失败
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & build
        run: pnpm build

      # 发布到 GitHub Releases 草稿（publish.releaseType 保持默认 draft，
      # 四个平台并发上传才会始终落到同一条 Release 上）
      - name: Package and publish draft (${{ matrix.platform }})
        run: pnpm exec electron-builder ${{ matrix.target }} --publish always

      # 发布失败时保留产物，方便排查 / 手动补传
      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/latest*.yml
            dist/*.blockmap
          retention-days: 3
          if-no-files-found: ignore

  notes:
    name: Fill draft release notes
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            index($0, "## 映盒剧场 v" ver) == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture && /^---[[:space:]]*$/ { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          # 去掉开头的空行
          sed -i '/./,$!d' release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::CHANGELOG 中 v${version} 小节为空"
            printf '暂无更新说明。\n' > release-notes.md
          fi
          echo '--- release notes ---'
          cat release-notes.md

      # 只填草稿的标题与说明，是否正式发布由发版人执行 gh release edit --draft=false
      - name: Fill draft release
        run: |
          gh release edit "$GITHUB_REF_NAME" \
            --title "映盒剧场 ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
