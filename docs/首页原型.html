<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>映盒剧场 · 首页原型</title>
    <!--
      首页视觉原型（独立文件，不参与构建）。
      色板 / 字号沿用 src/renderer/src/theme/appearance.ts 与 assets/main.css，
      直接贴进应用时把 <style> 里的 :root 变量换成应用已有的同名变量即可。

      可直接玩的地方：
      · 叠层：点右侧箭头 / 点露出来的那张 / 键盘 ← → 切换，7 秒自动轮播（悬停暂停）
      · 搜索：输入即时筛选，Ctrl K 聚焦，Esc 清空
      · 主题：右上角圆钮切换，或直接打开 首页原型.html?theme=dark
      封面图是 picsum 的占位图，放在 首页原型素材/ 里，接真实数据时换成 video.pic 即可。
    -->
    <style>
      :root {
        --bg: #f5f7fa;
        --surface: #ffffff;
        --surface-muted: #eef1f6;
        --elevated: #ffffff;
        --border: #e3e8ef;
        --border-strong: #cfd7e2;
        --text: #151a21;
        --text-muted: #5d6775;
        --text-faint: #8d97a5;
        --titlebar: #ffffff;
        --accent: #1296db;

        --font-sans:
          'Segoe UI Variable Text', 'Segoe UI', 'Microsoft YaHei UI', 'PingFang SC',
          'Hiragino Sans GB', system-ui, sans-serif;
        /* 标题用宋体：剧场的印刷传统，和正文黑体拉开层次 */
        --font-display:
          'Songti SC', 'STSong', 'Noto Serif SC', 'Source Han Serif SC', 'SimSun', '宋体', serif;
        --font-mono: 'Cascadia Code', 'JetBrains Mono', Consolas, ui-monospace, monospace;

        --radius-sm: 6px;
        --radius-md: 8px;
        --radius-lg: 12px;

        --shadow-card: 0 18px 44px rgba(13, 20, 30, 0.16), 0 2px 6px rgba(13, 20, 30, 0.08);
        --shadow-poster: 0 1px 2px rgba(13, 20, 30, 0.08);
      }

      [data-theme='dark'] {
        --bg: #0c0f13;
        --surface: #141920;
        --surface-muted: #1b2129;
        --elevated: #181e26;
        --border: #242c36;
        --border-strong: #33404e;
        --text: #e9edf2;
        --text-muted: #96a2b2;
        --text-faint: #697586;
        --titlebar: #0f1318;
        --accent: #3aa9e8;

        --shadow-card: 0 20px 48px rgba(0, 0, 0, 0.6), 0 2px 8px rgba(0, 0, 0, 0.45);
        --shadow-poster: 0 1px 2px rgba(0, 0, 0, 0.5);
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.5 var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        user-select: none;
        cursor: default;
      }

      input {
        user-select: text;
      }

      ::selection {
        background: color-mix(in srgb, var(--accent) 28%, transparent);
      }

      :focus-visible {
        outline: 2px solid color-mix(in srgb, var(--accent) 65%, transparent);
        outline-offset: 2px;
      }

      /* ── 应用骨架 ── */

      .app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      .titlebar {
        display: flex;
        flex: 0 0 44px;
        align-items: center;
        height: 44px;
        padding-left: 10px;
        border-bottom: 1px solid var(--border);
        background: var(--titlebar);
      }

      .titlebar-brand {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 8px 0 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        cursor: default;
      }

      .titlebar-logo {
        display: block;
        width: 20px;
        height: 20px;
      }

      .titlebar-name {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      .titlebar-drag {
        flex: 1;
        align-self: stretch;
      }

      .titlebar-actions {
        display: flex;
        align-items: center;
        height: 100%;
      }

      .titlebar-action,
      .window-btn {
        display: grid;
        width: 42px;
        height: 100%;
        place-items: center;
        border: 0;
        background: none;
        color: var(--text-muted);
        cursor: default;
      }

      .titlebar-action:hover {
        background: var(--surface-muted);
        color: var(--text);
      }

      .window-btn {
        width: 46px;
      }

      .window-btn:hover {
        background: var(--surface-muted);
        color: var(--text);
      }

      .window-btn--close:hover {
        background: #e81123;
        color: #fff;
      }

      .titlebar-divider {
        width: 1px;
        height: 16px;
        margin: 0 6px;
        background: var(--border);
      }

      .page {
        flex: 1;
        min-height: 0;
        overflow-x: hidden;
        overflow-y: auto;
      }

      .page::-webkit-scrollbar {
        width: 10px;
      }

      .page::-webkit-scrollbar-thumb {
        border: 3px solid transparent;
        border-radius: 999px;
        background: var(--border-strong);
        background-clip: content-box;
      }

      .home {
        max-width: 1120px;
        margin: 0 auto;
        padding: 20px 32px 72px;
      }

      /* ── 搜索 ── */

      .toolbar {
        display: flex;
        gap: 18px;
        align-items: center;
        margin-bottom: 22px;
      }

      .search {
        display: flex;
        flex: 1;
        gap: 10px;
        align-items: center;
        padding-bottom: 9px;
        border-bottom: 1px solid var(--border-strong);
        transition: border-color 0.18s ease;
      }

      .search:focus-within {
        border-bottom-color: var(--accent);
      }

      .search-icon {
        flex: none;
        color: var(--text-faint);
      }

      .search input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: none;
        background: none;
        color: var(--text);
        font: inherit;
        font-size: 15px;
      }

      .search input::placeholder {
        color: var(--text-faint);
      }

      .search input::-webkit-search-cancel-button {
        display: none;
      }

      .search-hint {
        flex: none;
        color: var(--text-faint);
        font-size: 11px;
        letter-spacing: 0.04em;
      }

      .search-clear {
        display: grid;
        flex: none;
        width: 20px;
        height: 20px;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: var(--surface-muted);
        color: var(--text-muted);
        cursor: pointer;
      }

      .search-clear[hidden] {
        display: none;
      }

      .search-clear:hover {
        color: var(--text);
      }

      .theme-toggle {
        display: grid;
        flex: none;
        width: 34px;
        height: 34px;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--surface);
        color: var(--text-muted);
        cursor: pointer;
        transition:
          color 0.15s ease,
          border-color 0.15s ease;
      }

      .theme-toggle:hover {
        border-color: var(--border-strong);
        color: var(--text);
      }

      /* ── 海报叠层 ── */

      .hero {
        position: relative;
        display: grid;
        grid-template-columns: 264px minmax(0, 1fr);
        gap: 60px;
        align-items: center;
        padding-bottom: 34px;
      }

      .hero::before {
        position: absolute;
        z-index: 0;
        top: -40px;
        left: -60px;
        width: 520px;
        height: 520px;
        background: radial-gradient(
          closest-side,
          color-mix(in srgb, var(--accent) 14%, transparent),
          transparent 72%
        );
        content: '';
        pointer-events: none;
      }

      .deck {
        position: relative;
        z-index: 1;
        width: 264px;
        height: 437px;
      }

      .deck-card {
        position: absolute;
        top: var(--top);
        left: 50%;
        display: block;
        width: var(--w);
        height: 384px;
        padding: 0;
        overflow: hidden;
        border: 0;
        border-radius: 14px;
        background:
          linear-gradient(
            155deg,
            color-mix(in srgb, var(--accent) 12%, var(--surface-muted)),
            var(--surface-muted) 72%
          );
        box-shadow: var(--shadow-card);
        transform: translateX(-50%);
        cursor: pointer;
      }

      .deck-card::after {
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: #05080c;
        content: '';
        opacity: var(--dim);
        pointer-events: none;
      }

      .deck-card[data-slot='0'] {
        cursor: default;
        box-shadow:
          var(--shadow-card),
          0 0 0 1px color-mix(in srgb, var(--text) 8%, transparent);
      }

      .deck-card img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* 图片在框内上下左右居中，不贴顶 */
        object-position: 50% 50%;
        opacity: 0;
        transform: translateY(-12px);
      }

      /* 首帧不要淡入，否则一进首页会先空一下 */
      .deck.is-ready .deck-card img {
        transition:
          opacity 0.4s ease,
          transform 0.48s cubic-bezier(0.2, 0.7, 0.25, 1);
      }

      .deck-card img.is-in {
        opacity: 1;
        transform: none;
      }

      .deck-card[data-slot='0'] img.is-out {
        opacity: 0;
        transform: translateY(12px);
      }

      .deck-info {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 320px;
        padding-top: 2px;
      }

      .deck-info.is-swapping {
        opacity: 0;
        transform: translateY(5px);
      }

      .deck-info {
        transition:
          opacity 0.26s ease,
          transform 0.26s ease;
      }

      .hero-meta {
        margin: 0;
        color: var(--text-faint);
        font-size: 13px;
        letter-spacing: 0.02em;
        font-variant-numeric: tabular-nums;
      }

      .hero-title {
        display: -webkit-box;
        overflow: hidden;
        margin: 12px 0 0;
        font-family: var(--font-display);
        font-size: 44px;
        font-weight: 600;
        line-height: 1.24;
        letter-spacing: 0.01em;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .hero-actors {
        overflow: hidden;
        margin: 16px 0 0;
        color: var(--text-muted);
        font-size: 13.5px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .hero-actors span {
        margin-right: 6px;
        color: var(--text-faint);
      }

      .hero-intro {
        display: -webkit-box;
        overflow: hidden;
        max-width: 560px;
        margin: 16px 0 0;
        color: var(--text-muted);
        font-size: 14.5px;
        line-height: 1.8;
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 2;
      }

      .hero-actions {
        display: flex;
        gap: 10px;
        align-items: center;
        padding-top: 28px;
      }

      .btn {
        display: inline-flex;
        gap: 7px;
        align-items: center;
        height: 36px;
        padding: 0 20px;
        border: 1px solid transparent;
        border-radius: var(--radius-md);
        background: none;
        color: inherit;
        font: inherit;
        font-size: 13.5px;
        cursor: pointer;
        transition:
          background 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
      }

      .btn-primary {
        background: var(--accent);
        color: #fff;
      }

      .btn-primary:hover {
        background: color-mix(in srgb, var(--accent) 86%, #000);
      }

      .btn-primary:active {
        background: color-mix(in srgb, var(--accent) 78%, #000);
      }

      .btn-ghost {
        border-color: var(--border-strong);
        color: var(--text-muted);
      }

      .btn-ghost:hover {
        border-color: var(--text-faint);
        color: var(--text);
      }

      .pager {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-left: auto;
      }

      .pager-count {
        color: var(--text-faint);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 0.04em;
      }

      .pager-count b {
        color: var(--text-muted);
        font-weight: 600;
      }

      .icon-btn {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--surface);
        color: var(--text-muted);
        cursor: pointer;
        transition:
          color 0.15s ease,
          border-color 0.15s ease;
      }

      .icon-btn:hover {
        border-color: var(--border-strong);
        color: var(--text);
      }

      .icon-btn:active {
        background: var(--surface-muted);
      }

      /* 叠层里露出的下一张，点一下翻到最前面 */

      /* ── 搜索结果状态行 ── */

      .result-line {
        display: flex;
        gap: 8px;
        align-items: baseline;
        margin: 0 0 6px;
        color: var(--text-muted);
        font-size: 12.5px;
      }

      .result-line em {
        color: var(--text);
        font-style: normal;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
      }

      .result-line[hidden] {
        display: none;
      }

      /* ── 分类区块 ── */

      .section {
        margin-top: 42px;
      }

      .section-head {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 16px;
        padding-bottom: 11px;
        border-bottom: 1px solid var(--border);
      }

      .section-title {
        margin: 0;
        font-family: var(--font-display);
        font-size: 21px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .section-count {
        color: var(--text-faint);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .section-tools {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-left: auto;
      }

      .section-more {
        border: 0;
        background: none;
        color: var(--text-muted);
        font: inherit;
        font-size: 12.5px;
        cursor: pointer;
      }

      .section-more:hover {
        color: var(--accent);
      }

      .rail-nav {
        display: flex;
        gap: 6px;
      }

      .rail-btn {
        display: grid;
        width: 26px;
        height: 26px;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--surface);
        color: var(--text-muted);
        cursor: pointer;
        transition:
          opacity 0.15s ease,
          border-color 0.15s ease,
          color 0.15s ease;
      }

      .rail-btn:hover {
        border-color: var(--border-strong);
        color: var(--text);
      }

      .rail-btn:disabled {
        opacity: 0.32;
        cursor: default;
      }

      .rail-btn:disabled:hover {
        border-color: var(--border);
        color: var(--text-muted);
      }

      .rail {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: 146px;
        gap: 14px;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
        scroll-behavior: smooth;
        scroll-snap-type: x proximity;
        /* 右侧渐隐，被裁掉的半张卡不会硬切；滚到末尾时也自然收口 */
        mask-image: linear-gradient(to right, #000 calc(100% - 46px), transparent 100%);
      }

      .rail::-webkit-scrollbar {
        display: none;
      }

      .item {
        display: block;
        min-width: 0;
        color: inherit;
        text-decoration: none;
        cursor: pointer;
        scroll-snap-align: start;
      }

      .item-poster {
        position: relative;
        overflow: hidden;
        aspect-ratio: 2 / 3;
        border-radius: 10px;
        background:
          linear-gradient(
            155deg,
            color-mix(in srgb, var(--accent) 10%, var(--surface-muted)),
            var(--surface-muted) 72%
          );
        box-shadow:
          var(--shadow-poster),
          0 0 0 1px color-mix(in srgb, var(--text) 6%, transparent);
      }

      .item-poster img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        /* 同样的居中规则：上下留白对半，不贴顶 */
        object-position: 50% 50%;
        transition:
          transform 0.4s cubic-bezier(0.2, 0.7, 0.25, 1),
          filter 0.25s ease;
      }

      .item-poster::after {
        position: absolute;
        inset: 0;
        background: rgba(6, 10, 16, 0.22);
        content: '';
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .item-play {
        position: absolute;
        z-index: 1;
        top: 50%;
        left: 50%;
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.94);
        color: #10151c;
        opacity: 0;
        transform: translate(-50%, -46%) scale(0.92);
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }

      .item:hover .item-poster img {
        transform: scale(1.035);
      }

      .item:hover .item-poster::after,
      .item:hover .item-play,
      .item:focus-visible .item-poster::after,
      .item:focus-visible .item-play {
        opacity: 1;
      }

      .item:hover .item-play {
        transform: translate(-50%, -50%) scale(1);
      }

      .item-title {
        overflow: hidden;
        margin: 9px 0 0;
        color: var(--text);
        font-size: 13.5px;
        font-weight: 500;
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .item-note {
        overflow: hidden;
        margin: 5px 0 0;
        color: var(--text-muted);
        font-size: 12px;
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .item-sub {
        overflow: hidden;
        margin: 3px 0 0;
        color: var(--text-muted);
        font-size: 11.5px;
        line-height: 1.35;
        text-overflow: ellipsis;
        white-space: nowrap;
        opacity: 0.78;
      }

      /* ── 空状态 ── */

      .empty {
        padding: 64px 0 40px;
        text-align: center;
      }

      .empty-title {
        margin: 0;
        color: var(--text);
        font-family: var(--font-display);
        font-size: 20px;
      }

      .empty-desc {
        margin: 8px 0 0;
        color: var(--text-muted);
        font-size: 13px;
      }

      .empty .btn {
        margin-top: 20px;
      }

      @media (max-width: 1080px) {
        .home {
          padding-inline: 26px;
        }

        .hero {
          gap: 40px;
        }

        .hero-title {
          font-size: 34px;
        }

        .rail {
          grid-auto-columns: 132px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="titlebar">
        <div class="titlebar-brand">
          <svg class="titlebar-logo" viewBox="60.5 62 903 903" aria-hidden="true">
            <path
              d="M811.3 66.9H212.2c-80.9 0.1-146.5 65.7-146.6 146.6v599.1c0 81 65.6 146.8 146.7 147h599.1c81.1-0.2 146.7-65.9 146.7-147V213.5c-0.3-80.9-65.8-146.5-146.8-146.6z m-0.3 603.7c0 10.3-5.5 19.9-14.4 25.1L525.5 852.2c-4.4 2.5-9.4 3.8-14.4 3.8-4.8-0.4-9.5-2-13.6-4.6L226.1 694.8c-9-5.2-14.5-14.8-14.4-25.1v-313c0-10.4 5.5-19.9 14.4-25.1l271.4-156.5c8.9-5.2 19.9-5.2 28.9 0l271.1 156.5c8.6 5.4 13.8 14.9 13.6 25.1v313.9z"
              fill="#1296db"
            />
            <path
              d="M475.6 402.3H343.3c-10.3 0-19.8 5.5-25 14.4-5.2 8.9-5.2 19.9 0 28.9 5.2 8.9 14.7 14.4 25 14.4H382v136c0 10.3 5.5 19.8 14.4 25 8.9 5.2 19.9 5.2 28.9 0 8.9-5.2 14.4-14.7 14.4-25V460h35.8c10.3 0 19.8-5.5 25-14.4 5.2-8.9 5.2-19.9 0-28.9-5.1-8.9-14.6-14.4-24.9-14.4z m116.6 195.8c3.1 7.2 8.9 12.8 16.2 15.6 2.9 1.1 5.9 1.8 8.9 2h1.4c11.8 0 22.5-7.2 26.8-18.2l60.6-148.1c6-14.8-1.2-31.7-16-37.7-14.8-6-31.7 1.2-37.7 16l-34.1 83.4-34.1-83.7c-6.1-14.8-23-21.9-37.8-15.9-14.8 6.1-21.9 23-15.9 37.8l61.7 148.8z"
              fill="#1296db"
            />
          </svg>
          <span class="titlebar-name">映盒剧场</span>
        </div>
        <div class="titlebar-drag"></div>

      const cards = SLIDES.map((slide, slot) => {
        const card = document.createElement('button')

        card.className = 'deck-card'
        card.dataset.slot = String(slot)
        card.style.setProperty('--top', SLOTS[slot].top + 'px')
        card.style.setProperty('--w', SLOTS[slot].width + 'px')
        card.style.setProperty('--dim', String(SLOTS[slot].dim))
        card.style.zIndex = String(SLOTS.length - slot)

        const a = document.createElement('img')
        const b = document.createElement('img')
        a.alt = ''
        b.alt = ''
        a.decoding = 'async'
        b.decoding = 'async'
        card.append(a, b)

        card.addEventListener('click', () => {
          go((state.index + slot) % SLIDES.length)
        })

        deck.appendChild(card)
        return { card, layers: [a, b], live: 0, src: '', target: slide, busy: false }
      })

      /**
       * 两张 img 交叉淡入：旧图下沉淡出，新图落下。连点时只保留最后一次目标，
       * 等手上的切换结束后再补一次，避免叠层错位。
       */
      function swapImage(entry, slide) {
        entry.target = slide
        if (entry.busy) return
        runSwap(entry)
      }

      function runSwap(entry) {
        const slide = entry.target
        if (entry.src === slide.pic) return
        entry.busy = true

        const previous = entry.layers[entry.live]
        const next = entry.layers[1 - entry.live]
        entry.src = slide.pic

        let settled = false
        const reveal = () => {
          if (settled) return
          settled = true
          next.classList.add('is-in')
          previous.classList.add('is-out')
          previous.classList.remove('is-in')
          entry.live = 1 - entry.live
          window.setTimeout(() => previous.classList.remove('is-out'), 520)
          entry.busy = false
          // 切换途中又翻了一页，这里补上
          if (entry.target.pic !== entry.src) runSwap(entry)
        }

        next.onload = reveal
        next.onerror = reveal
        next.src = slide.pic
        if (next.complete) reveal()
        // 图片迟迟不来也不能把旧画面一直留在最前面
        window.setTimeout(reveal, 1500)
      }

      function slotLabel(slot) {
        return SLIDES[(state.index + slot) % SLIDES.length]
      }

      function renderDeck(animate) {
        cards.forEach((entry, slot) => {
          const slide = slotLabel(slot)
          const isFront = slot === 0

          if (animate) swapImage(entry, slide)
          else {
            entry.layers[0].src = slide.pic
            entry.layers[0].classList.add('is-in')
            entry.src = slide.pic
          }
        })
        renderInfo()
        document.getElementById('pagerNow').textContent = String(state.index + 1).padStart(2, '0')

          CHEVRON_RIGHT +
          '</button>' +
          '</div>' +
          '</div>'

        document.getElementById('prevBtn').addEventListener('click', () => go(state.index - 1))

        deckInfo.classList.remove('is-swapping')
      }

      const PLAY_ICON =
        '<svg width="11" height="12" viewBox="0 0 11 12" aria-hidden="true"><path d="M1 1.2l9 4.8-9 4.8z" fill="currentColor"/></svg>'
      const CHEVRON_LEFT =
        '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M7.5 2.5L4 6l3.5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>'

        '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M4.5 2.5L8 6l-3.5 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>'

      let switching = false
      function go(index) {
        const total = SLIDES.length
        const next = ((index % total) + total) % total
        if (next === state.index) return

        deckInfo.classList.add('is-swapping')

        restartAutoplay()

      // ── 分类轨道 ──────────────────────────────────────────────

      const sections = document.getElementById('sections')

      function itemHtml(item, sectionName) {

          '<span class="section-count" data-count>' + section.total + ' 部</span>' +
          '<div class="section-tools">' +
          '<button class="section-more" type="button">全部</button>' +
          '<div class="rail-nav">' +
          '<button class="rail-btn" type="button" data-dir="-1" aria-label="向前">' + CHEVRON_LEFT + '</button>' +
          '<button class="rail-btn" type="button" data-dir="1" aria-label="向后">' + CHEVRON_RIGHT + '</button>' +
          '</div>' +
          '</div>' +
          '</div>' +
          '<div class="rail">' +
          section.items.map((item) => itemHtml(item, section.name)).join('') +
          '</div>'
        sections.appendChild(block)

        const rail = block.querySelector('.rail')
        block.querySelectorAll('.rail-btn').forEach((btn) => {
          btn.addEventListener('click', () => {
            const dir = Number(btn.dataset.dir)
            rail.scrollBy({ left: dir * 3 * (rail.firstElementChild.offsetWidth + 16) })
          })
        })

        rail.addEventListener('scroll', () => updateRail(block))
        updateRail(block)

        block.querySelectorAll('.item').forEach((link) => {
          link.addEventListener('click', (event) => event.preventDefault())
        })
      })

      /** 轨道两端的箭头按可滚动范围置灰，筛选后也要重算一次 */
      function updateRail(block) {
        const rail = block.querySelector('.rail')
        const max = rail.scrollWidth - rail.clientWidth
        block.querySelector('[data-dir="-1"]').disabled = rail.scrollLeft <= 1
        block.querySelector('[data-dir="1"]').disabled = max <= 1 || rail.scrollLeft >= max - 1
      }

      // ── 搜索 ──────────────────────────────────────────────────

      const input = document.getElementById('searchInput')
      const clearBtn = document.getElementById('searchClear')
      const hint = document.getElementById('searchHint')
      const resultLine = document.getElementById('resultLine')

      function applyFilter(query) {
        state.query = query.trim().toLowerCase()
        const searching = state.query.length > 0
        let matched = 0

        sections.querySelectorAll('.section').forEach((block) => {
          let visible = 0
          block.querySelectorAll('.item').forEach((item) => {
            const hit = !searching || item.dataset.hay.includes(state.query)
            item.hidden = !hit
            item.style.display = hit ? '' : 'none'
            if (hit) visible += 1
          })
          block.hidden = visible === 0
          block.querySelector('[data-count]').textContent = searching
            ? visible + ' 部'
            : SECTIONS.find((s) => s.name === block.dataset.name).total + ' 部'
          block.querySelector('.rail').scrollLeft = 0
          updateRail(block)
          matched += visible
        })

        clearBtn.hidden = !searching
        hint.hidden = searching
        // 一条就够：有结果才报数量，没结果交给下面的空状态
        resultLine.hidden = !searching || matched === 0
        if (searching) {
          resultLine.innerHTML =
            matched > 0
              ? '搜索「' + escapeHtml(query) + '」找到 <em>' + matched + '</em> 部影片'
              : '搜索「' + escapeHtml(query) + '」没有结果'
        }

        document.getElementById('empty')?.remove()
        if (searching && matched === 0) {
          const empty = document.createElement('div')
          empty.className = 'empty'
          empty.id = 'empty'
          empty.innerHTML =
            '<p class="empty-title">片库里没有「' + escapeHtml(query.trim()) + '」</p>' +
            '<p class="empty-desc">换个片名、演员或分类再试一次</p>' +
            '<button class="btn btn-ghost" type="button" id="emptyClear">清除搜索</button>'
          sections.appendChild(empty)
          document.getElementById('emptyClear').addEventListener('click', () => {
            input.value = ''
            applyFilter('')
            input.focus()
          })
        }
      }

      input.addEventListener('input', () => applyFilter(input.value))
      clearBtn.addEventListener('click', () => {
        input.value = ''
        applyFilter('')
        input.focus()
      })

      document.addEventListener('keydown', (event) => {
        const typing = document.activeElement === input
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
          event.preventDefault()
          input.focus()
          input.select()
          return
        }
        if (event.key === 'Escape' && typing && input.value) {
          input.value = ''
          applyFilter('')
          return
        }
        if (typing) return
        if (event.key === 'ArrowLeft') go(state.index - 1)
        if (event.key === 'ArrowRight') go(state.index + 1)
      })

      // ── 自动轮播 ──────────────────────────────────────────────

      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches
      let autoplay = 0
      let paused = false

      function restartAutoplay() {
        window.clearInterval(autoplay)
        if (reduceMotion) return
        autoplay = window.setInterval(() => {
          if (!paused && !document.hidden) go(state.index + 1)
        }, 7000)
      }

      document.querySelector('.hero').addEventListener('pointerenter', () => (paused = true))
      document.querySelector('.hero').addEventListener('pointerleave', () => (paused = false))

      // ── 主题 / 工具 ───────────────────────────────────────────

      document.getElementById('themeToggle').addEventListener('click', () => {
        const root = document.documentElement
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark'
      })

      // 便于直接看深色版：首页原型.html?theme=dark
      if (new URLSearchParams(location.search).get('theme') === 'dark') {
        document.documentElement.dataset.theme = 'dark'
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (ch) => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          '"': '&quot;',
          "'": '&#39;'
        })[ch])
      }

      function escapeAttr(value) {
        return escapeHtml(value)
      }

      renderDeck(false)
      requestAnimationFrame(() => deck.classList.add('is-ready'))
      restartAutoplay()
    </script>
  </body>
</html>
