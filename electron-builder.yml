appId: com.0x2one.cinebox
productName: cine-box
copyright: Copyright © 2026 0x2one

directories:
  buildResources: build
  output: dist

files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,pnpm-workspace.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!{.github,.agents,build,dist,docs}/**'

asarUnpack:
  - resources/**

# 国内网络直连 GitHub 拉 Electron 二进制很慢，统一切到镜像（CI 上同样可用）
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/

# 这里裁的是 Electron/Chromium 原生文案包（locales/*.pak），界面文案走渲染层的 antd 中文包。
# 保留 en-US 只为回退兜底：系统 locale 不是中文时 Chromium 会退到 en-US，
# 否则 macOS 应用菜单、崩溃弹窗等原生字符串可能为空（electron#52307 也提示 locales 不能删空）。
electronLanguages:
  - zh-CN
  - en-US

win:
  executableName: cine-box
  icon: build/icon.ico
  target:
    - nsis

nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 映盒剧场
  uninstallDisplayName: 映盒剧场
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: ${name}-${version}-win-${arch}.${ext}
  deleteAppDataOnUninstall: false

mac:
  icon: build/icon.icns
  category: public.app-category.entertainment
  # dmg 供人工安装，zip 是 macOS 自动更新（Squirrel.Mac）必需产物
  target:
    - dmg
    - zip
  artifactName: ${name}-${version}-mac-${arch}.${ext}
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  notarize: false
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.

dmg:
  artifactName: ${name}-${version}-mac-${arch}.${ext}

linux:
  icon: build/icon.png
  category: AudioVideo
  maintainer: 0x2one <0x2one@users.noreply.github.com>
  target:
    - AppImage
    - deb
  artifactName: ${name}-${version}-linux-${arch}.${ext}
  desktop:
    entry:
      Name: 映盒剧场
      Comment: 映盒剧场

npmRebuild: false

# 应用内更新（electron-updater）与 CI 发布都读取这里。
# 刻意保持 GitHub 默认的 draft：四个平台并发上传同一个 tag 时，
# 显式 releaseType: release 会被拆成多条 Release。正式发布由发版 skill 人工完成。
publish:
  provider: github
  owner: 0x2one
  repo: cine-box
